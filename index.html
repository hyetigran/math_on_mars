<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#173d3a" />
    <meta
      name="description"
      content="Build a town on Mars. Grow food and practice math to speed up construction."
    />
    <title>Math on Mars</title>
    <script>
      if (
        "__wgEditorCam" in window &&
        !location.pathname.replace(/\/+$/, "").endsWith("/dist")
      ) {
        const compiledApp = new URL("dist/", document.baseURI);
        compiledApp.search = location.search;
        compiledApp.hash = location.hash;
        location.replace(compiledApp);
      }
    </script>
  </head>

    <a class="skip-link" href="#content">Skip to content</a>
    <div id="town-app"></div>
    <script type="module" src="/src/town-app.ts"></script>
